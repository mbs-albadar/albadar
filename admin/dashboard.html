<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard Admin | SMP MBS Al Badar Prambanan</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-ppm-mbs.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #04473A;
            --color-primary-hover: #03382D;
            --color-secondary: #11366E;
            --lux-dark: #04473A;
            --lux-gold: #D4B582;
            --lux-bg: #F8F9FA;
            --color-surface: #FFFFFF;
            --color-text-main: #1F2937;
            --color-text-muted: #6B7280;
            --color-border: #E5E7EB;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --shadow-sm: 0 2px 8px rgba(4, 71, 58, 0.08);
            --shadow-md: 0 8px 24px rgba(4, 71, 58, 0.12);
            --font-heading: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--lux-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            background-image: radial-gradient(circle at 10% 20%, rgba(4, 71, 58, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(17, 54, 110, 0.05) 0%, transparent 40%);
        }

        .dashboard-card {
            width: 100%;
            max-width: 520px;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            padding: 2.5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--lux-gold));
        }

        .badge-placeholder {
            display: inline-block;
            background: rgba(212, 181, 130, 0.18);
            color: var(--color-primary);
            border: 1px solid var(--lux-gold);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.35rem 0.85rem;
            border-radius: var(--radius-pill);
            margin-bottom: 1.25rem;
        }

        .dashboard-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--lux-dark);
            margin-bottom: 0.75rem;
        }

        .dashboard-info {
            font-size: 1.05rem;
            color: var(--color-text-main);
            margin-bottom: 1.75rem;
            line-height: 1.7;
        }

        .role-pill {
            display: inline-block;
            background: var(--color-primary);
            color: #ffffff;
            font-weight: 600;
            padding: 0.2rem 0.65rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            letter-spacing: 0.5px;
        }

        .btn-logout {
            padding: 0.75rem 1.75rem;
            background-color: transparent;
            color: var(--color-text-muted);
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-pill);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-logout:hover {
            background-color: #FEE2E2;
            color: #DC2626;
            border-color: #FECACA;
        }

        .loading-state {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            padding: 1.5rem 0;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(4, 71, 58, 0.2);
            border-radius: 50%;
            border-top-color: var(--color-primary);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <main class="dashboard-card">
        <div id="loading" class="loading-state">
            <div class="spinner" aria-hidden="true"></div>
            Memuat data sesi...
        </div>

        <div id="content" style="display: none;">
            <span class="badge-placeholder">Halaman Placeholder Sementara</span>
            <h1 class="dashboard-title">Panel Administrasi</h1>
            <p class="dashboard-info" id="welcomeText">
                <!-- Data from Supabase will be injected here -->
            </p>
            <button id="logoutBtn" class="btn-logout" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Keluar (Logout)
            </button>
        </div>
    </main>

    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>

    <script>
        const loadingEl = document.getElementById('loading');
        const contentEl = document.getElementById('content');
        const welcomeText = document.getElementById('welcomeText');
        const logoutBtn = document.getElementById('logoutBtn');

        async function initDashboard() {
            try {
                // 1. Check session
                const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();

                if (sessionError || !session || !session.user) {
                    window.location.replace('login.html');
                    return;
                }

                // 2. Fetch admin profile
                const { data: profile, error: profileError } = await supabaseClient
                    .from('admin_profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

                if (profileError || !profile) {
                    // Not registered in admin_profiles
                    await supabaseClient.auth.signOut();
                    window.location.replace('login.html');
                    return;
                }

                // 3. Render greeting
                const fullName = profile.full_name || session.user.email;
                const role = profile.role || 'admin';
                welcomeText.innerHTML = `Selamat datang, <strong>${escapeHtml(fullName)}</strong>.<br>Role Anda: <span class="role-pill">${escapeHtml(role)}</span>.`;

                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';
            } catch (err) {
                console.error('Error initializing dashboard:', err);
                window.location.replace('login.html');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        logoutBtn.addEventListener('click', async () => {
            logoutBtn.disabled = true;
            try {
                await supabaseClient.auth.signOut();
            } catch (err) {
                console.error('Logout error:', err);
            } finally {
                window.location.replace('login.html');
            }
        });

        initDashboard();
    </script>
</body>
</html>
