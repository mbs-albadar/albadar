<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login Administrator | SMP MBS Al Badar Prambanan</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-ppm-mbs.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #04473A;
            --color-primary-hover: #03382D;
            --color-secondary: #11366E;
            --lux-dark: #04473A;
            --lux-gold: #D4B582;
            --lux-gold-hover: #C5A46D;
            --lux-bg: #F8F9FA;
            --color-surface: #FFFFFF;
            --color-text-main: #1F2937;
            --color-text-muted: #6B7280;
            --color-border: #E5E7EB;
            --color-error: #DC2626;
            --color-error-bg: #FEF2F2;
            --color-error-border: #FECACA;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --shadow-sm: 0 2px 8px rgba(4, 71, 58, 0.08);
            --shadow-md: 0 8px 24px rgba(4, 71, 58, 0.12);
            --shadow-lg: 0 20px 50px rgba(4, 71, 58, 0.15);
            --font-heading: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--lux-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            background-image: radial-gradient(circle at 10% 20%, rgba(4, 71, 58, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(17, 54, 110, 0.05) 0%, transparent 40%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            padding: 2.5rem 2rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--lux-gold));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin: 0 auto 1rem;
            display: block;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            color: var(--lux-dark);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-main);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--color-text-main);
            background: #FFFFFF;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(4, 71, 58, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background-color: var(--color-primary);
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            background-color: var(--color-error-bg);
            border: 1px solid var(--color-error-border);
            color: var(--color-error);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }

        .alert-error.visible {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .btn-loading-text {
            display: inline;
        }

        .btn-loading-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            border-top: 1px solid var(--color-border);
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="brand-header">
            <img src="../assets/img/logo-ppm-mbs.png" alt="Logo SMP MBS Al Badar" class="brand-logo" onerror="this.style.display='none'">
            <h1 class="brand-title">Portal Administrasi</h1>
            <p class="brand-subtitle">SMP MBS Al Badar Prambanan</p>
        </header>

        <div id="errorAlert" class="alert-error" role="alert" aria-live="polite">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; margin-top: 1px;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="errorMessage"></span>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email" class="form-label">Alamat Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="admin@albadar.sch.id" required autofocus autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Kata Sandi</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span class="spinner" aria-hidden="true"></span>
                <span class="btn-text">Masuk</span>
                <span class="btn-loading-text">Memverifikasi...</span>
            </button>
        </form>

        <footer class="login-footer">
            &copy; 2026 SMP MBS Al Badar Prambanan. Akses Terbatas.
        </footer>
    </main>

    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        function showError(msg) {
            errorMessage.textContent = msg;
            errorAlert.classList.add('visible');
        }

        function hideError() {
            errorAlert.classList.remove('visible');
            errorMessage.textContent = '';
        }

        // Auto redirect if already logged in as valid admin
        async function checkExistingSession() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const { data: profile, error } = await supabaseClient
                        .from('admin_profiles')
                        .select('role')
                        .eq('id', session.user.id)
                        .single();

                    if (profile && !error) {
                        window.location.replace('dashboard.html');
                    }
                }
            } catch (err) {
                console.error('Session check error:', err);
            }
        }
        checkExistingSession();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Mohon masukkan email dan password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                // 1. Sign in with Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    showError('Email atau password salah.');
                    return;
                }

                if (!authData || !authData.user) {
                    showError('Email atau password salah.');
                    return;
                }

                // 2. Check admin_profiles table
                const { data: profile, error: profileError } = await supabaseClient
                    .from('admin_profiles')
                    .select('id, full_name, role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError || !profile) {
                    // Authenticated user is not registered in admin_profiles
                    await supabaseClient.auth.signOut();
                    showError('Akun ini tidak terdaftar sebagai admin.');
                    return;
                }

                // 3. Success: redirect to dashboard
                window.location.replace('dashboard.html');
            } catch (err) {
                console.error('Login error:', err);
                showError('Terjadi kesalahan koneksi. Silakan coba lagi.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });
    </script>
</body>
</html>
