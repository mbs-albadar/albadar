<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login Administrator | SMP MBS Al Badar Prambanan</title>
    <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #04473A;
            --color-primary-hover: #03382D;
            --color-secondary: #11366E;
            --lux-dark: #04473A;
            --lux-gold: #D4B582;
            --lux-gold-hover: #C5A46D;
            --lux-bg: #F8F9FA;
            --color-surface: #FFFFFF;
            --color-text-main: #1F2937;
            --color-text-muted: #6B7280;
            --color-border: #E5E7EB;
            --color-error: #DC2626;
            --color-error-bg: #FEF2F2;
            --color-error-border: #FECACA;
            --color-success: #065F46;
            --color-success-bg: #ECFDF5;
            --color-success-border: #A7F3D0;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --shadow-sm: 0 2px 8px rgba(4, 71, 58, 0.08);
            --shadow-md: 0 8px 24px rgba(4, 71, 58, 0.12);
            --shadow-lg: 0 20px 50px rgba(4, 71, 58, 0.15);
            --font-heading: 'Fraunces', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--lux-bg);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            background-image: radial-gradient(circle at 10% 20%, rgba(4, 71, 58, 0.04) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(17, 54, 110, 0.05) 0%, transparent 40%);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--color-border);
            padding: 2.5rem 2rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--lux-gold));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            margin: 0 auto 1rem;
            display: block;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            color: var(--lux-dark);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-text-main);
            margin-bottom: 0.4rem;
        }

        .password-field-wrapper {
            position: relative;
            width: 100%;
        }

        .password-field-wrapper .form-input {
            padding-right: 2.75rem;
        }

        .btn-toggle-password {
            position: absolute;
            right: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            min-width: 36px;
            min-height: 36px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--color-text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .btn-toggle-password:hover {
            color: var(--color-text-main);
            background-color: rgba(0, 0, 0, 0.04);
        }

        .btn-toggle-password:focus-visible {
            outline: 2px solid var(--lux-gold);
            outline-offset: 1px;
        }

        .caps-warning {
            font-size: 0.75rem;
            color: #B45309;
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
        }

        .caps-warning[hidden] {
            display: none;
        }

        .form-options-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 0.5rem;
        }

        .link-action {
            background: none;
            border: none;
            color: var(--color-primary);
            font-family: var(--font-body);
            font-size: 0.8125rem;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
            padding: 0.25rem 0;
            transition: color 0.15s ease;
        }

        .link-action:hover {
            color: var(--color-primary-hover);
        }

        .link-action:focus-visible {
            outline: 2px solid var(--lux-gold);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .reset-header {
            margin-bottom: 1.5rem;
        }

        .reset-title {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            color: var(--lux-dark);
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .reset-description {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            line-height: 1.4;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--color-text-main);
            background: #FFFFFF;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-sm);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(4, 71, 58, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem 1.5rem;
            background-color: var(--color-primary);
            color: #FFFFFF;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-pill);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: var(--color-primary-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            background-color: var(--color-error-bg);
            border: 1px solid var(--color-error-border);
            color: var(--color-error);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }

        .alert-error.visible {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .alert-success {
            background-color: var(--color-success-bg);
            border: 1px solid var(--color-success-border);
            color: var(--color-success);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: none;
            line-height: 1.4;
        }

        .alert-success.visible {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-submit.loading .spinner {
            display: inline-block;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .btn-loading-text {
            display: inline;
        }

        .btn-loading-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            border-top: 1px solid var(--color-border);
            padding-top: 1rem;
        }

        @media (max-width: 400px) {
            body {
                padding: 1rem;
            }
            .login-card {
                padding: 2rem 1.25rem;
            }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <header class="brand-header">
            <img src="../assets/img/logo.png" alt="Logo SMP MBS Al Badar" class="brand-logo" onerror="this.style.display='none'">
            <h1 class="brand-title">Portal Administrasi</h1>
            <p class="brand-subtitle">SMP MBS Al Badar Prambanan</p>
        </header>

        <div id="errorAlert" class="alert-error" role="alert" aria-live="polite">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0; margin-top: 1px;">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="errorMessage"></span>
        </div>

        <div id="successAlert" class="alert-success" role="status" aria-live="polite">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span id="successMessage"></span>
        </div>

        <!-- Mode Form Login -->
        <div id="loginView">
            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email" class="form-label">Alamat Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="admin@albadar.sch.id" required autofocus autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Kata Sandi</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePasswordBtn" class="btn-toggle-password" aria-label="Tampilkan kata sandi" aria-pressed="false">
                            <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div id="capsLockWarning" class="caps-warning" role="status" hidden>Caps Lock sedang aktif</div>
                    <div class="form-options-row">
                        <button type="button" id="forgotPasswordBtn" class="link-action">Lupa kata sandi?</button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-text">Masuk</span>
                    <span class="btn-loading-text">Memverifikasi...</span>
                </button>
            </form>
        </div>

        <!-- Mode Reset Kata Sandi -->
        <div id="resetView" hidden>
            <div class="reset-header">
                <h2 class="reset-title">Atur Ulang Kata Sandi</h2>
                <p class="reset-description">Masukkan alamat email akun Anda untuk menerima tautan atur ulang kata sandi.</p>
            </div>
            <form id="resetForm" autocomplete="on">
                <div class="form-group">
                    <label for="resetEmail" class="form-label">Alamat Email</label>
                    <input type="email" id="resetEmail" name="resetEmail" class="form-input" placeholder="admin@albadar.sch.id" required autocomplete="email">
                </div>

                <button type="submit" id="sendResetBtn" class="btn-submit">
                    <span class="spinner" aria-hidden="true"></span>
                    <span class="btn-text" id="sendResetBtnText">Kirim Tautan Reset</span>
                    <span class="btn-loading-text">Mengirim...</span>
                </button>

                <div style="text-align: center; margin-top: 1.25rem;">
                    <button type="button" id="backToLoginBtn" class="link-action">Kembali ke halaman masuk</button>
                </div>
            </form>
        </div>

        <footer class="login-footer">
            &copy; 2026 SMP MBS Al Badar Prambanan. Akses Terbatas.
        </footer>
    </main>

    <!-- Supabase JS Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>

    <script>
        const loginView = document.getElementById('loginView');
        const resetView = document.getElementById('resetView');
        const loginForm = document.getElementById('loginForm');
        const resetForm = document.getElementById('resetForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const resetEmailInput = document.getElementById('resetEmail');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = submitBtn.querySelector('.btn-text');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const sendResetBtnText = document.getElementById('sendResetBtnText');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const capsLockWarning = document.getElementById('capsLockWarning');
        const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
        const backToLoginBtn = document.getElementById('backToLoginBtn');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successAlert = document.getElementById('successAlert');
        const successMessage = document.getElementById('successMessage');

        let failedLoginAttempts = 0;
        let loginLockoutTimer = null;
        let resetCountdownTimer = null;

        function showError(msg) {
            hideSuccess();
            errorMessage.textContent = msg;
            errorAlert.classList.add('visible');
        }

        function hideError() {
            errorAlert.classList.remove('visible');
            errorMessage.textContent = '';
        }

        function showSuccess(msg) {
            hideError();
            successMessage.textContent = msg;
            successAlert.classList.add('visible');
        }

        function hideSuccess() {
            successAlert.classList.remove('visible');
            successMessage.textContent = '';
        }

        // Periksa parameter ?reset=ok di URL
        try {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reset') === 'ok') {
                showSuccess('Kata sandi berhasil diubah. Silakan masuk dengan kata sandi baru.');
                urlParams.delete('reset');
                const remainingQuery = urlParams.toString();
                const cleanUrl = window.location.pathname + (remainingQuery ? '?' + remainingQuery : '') + (window.location.hash || '');
                window.history.replaceState({}, document.title, cleanUrl);
            }
        } catch (e) {
            // Ignore URL parameter parsing errors
        }

        // Tombol tampilkan/sembunyikan kata sandi
        const eyeIcon = togglePasswordBtn.querySelector('.eye-icon');
        const eyeOffIcon = togglePasswordBtn.querySelector('.eye-off-icon');

        togglePasswordBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const isPassword = passwordInput.getAttribute('type') === 'password';
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                togglePasswordBtn.setAttribute('aria-label', 'Sembunyikan kata sandi');
                togglePasswordBtn.setAttribute('aria-pressed', 'true');
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                passwordInput.setAttribute('type', 'password');
                togglePasswordBtn.setAttribute('aria-label', 'Tampilkan kata sandi');
                togglePasswordBtn.setAttribute('aria-pressed', 'false');
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
            passwordInput.focus();
        });

        togglePasswordBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
        });

        // Peringatan Caps Lock
        function checkCapsLock(e) {
            if (e && typeof e.getModifierState === 'function') {
                if (e.getModifierState('CapsLock')) {
                    capsLockWarning.hidden = false;
                } else {
                    capsLockWarning.hidden = true;
                }
            }
        }
        passwordInput.addEventListener('keydown', checkCapsLock);
        passwordInput.addEventListener('keyup', checkCapsLock);
        passwordInput.addEventListener('blur', () => {
            capsLockWarning.hidden = true;
        });

        // Ganti kartu ke mode reset / kembali ke login
        forgotPasswordBtn.addEventListener('click', () => {
            hideError();
            hideSuccess();
            loginView.hidden = true;
            resetView.hidden = false;
            if (emailInput.value.trim()) {
                resetEmailInput.value = emailInput.value.trim();
            }
            resetEmailInput.focus();
        });

        backToLoginBtn.addEventListener('click', () => {
            hideError();
            hideSuccess();
            resetView.hidden = true;
            loginView.hidden = false;
            emailInput.focus();
        });

        // Hitung mundur untuk tombol kirim reset
        function startResetCountdown(durationSeconds) {
            if (resetCountdownTimer) clearInterval(resetCountdownTimer);
            let remaining = durationSeconds;
            sendResetBtn.disabled = true;
            sendResetBtnText.textContent = `Kirim ulang dalam ${remaining} dtk`;

            resetCountdownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(resetCountdownTimer);
                    resetCountdownTimer = null;
                    sendResetBtn.disabled = false;
                    sendResetBtnText.textContent = 'Kirim Tautan Reset';
                } else {
                    sendResetBtnText.textContent = `Kirim ulang dalam ${remaining} dtk`;
                }
            }, 1000);
        }

        // Kirim reset kata sandi
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            hideSuccess();

            const email = resetEmailInput.value.trim();
            if (!email) {
                showError('Mohon masukkan alamat email.');
                return;
            }

            sendResetBtn.disabled = true;
            sendResetBtn.classList.add('loading');

            const genericSuccessMsg = 'Jika email terdaftar, tautan untuk mengatur ulang kata sandi telah dikirim. Periksa kotak masuk dan folder spam.';

            try {
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/admin/reset-password.html'
                });

                if (error) {
                    const errorMsg = (error.message || '').toLowerCase();
                    const isRateLimit = error.status === 429 || errorMsg.includes('rate');
                    if (isRateLimit) {
                        showError('Terlalu banyak permintaan. Coba lagi beberapa menit lagi.');
                        return;
                    }
                }

                showSuccess(genericSuccessMsg);
                startResetCountdown(60);
            } catch (err) {
                const errorMsg = (err && err.message ? err.message : '').toLowerCase();
                const isRateLimit = (err && err.status === 429) || errorMsg.includes('rate');
                if (isRateLimit) {
                    showError('Terlalu banyak permintaan. Coba lagi beberapa menit lagi.');
                    return;
                }
                showSuccess(genericSuccessMsg);
                startResetCountdown(60);
            } finally {
                sendResetBtn.classList.remove('loading');
                if (!resetCountdownTimer) {
                    sendResetBtn.disabled = false;
                }
            }
        });

        // Pencatatan gagal login & pembatasan sisi klien (lockout 30 dtk setelah 5 kali gagal)
        function recordFailedLogin(errorMsg) {
            failedLoginAttempts++;
            showError(errorMsg);
            if (failedLoginAttempts >= 5) {
                startLoginLockout(30);
            }
        }

        function startLoginLockout(durationSeconds) {
            if (loginLockoutTimer) clearInterval(loginLockoutTimer);
            let remaining = durationSeconds;
            submitBtn.disabled = true;
            submitBtnText.textContent = `Coba lagi dalam ${remaining} dtk`;

            loginLockoutTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(loginLockoutTimer);
                    loginLockoutTimer = null;
                    failedLoginAttempts = 0;
                    submitBtn.disabled = false;
                    submitBtnText.textContent = 'Masuk';
                } else {
                    submitBtnText.textContent = `Coba lagi dalam ${remaining} dtk`;
                }
            }, 1000);
        }

        // Auto redirect if already logged in as valid admin
        async function checkExistingSession() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const { data: profile, error } = await supabaseClient
                        .from('admin_profiles')
                        .select('role')
                        .eq('id', session.user.id)
                        .single();

                    if (profile && !error) {
                        window.location.replace('/admin/dashboard.html');
                    }
                }
            } catch (err) {
                console.error('Session check error:', err);
            }
        }
        checkExistingSession();

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginLockoutTimer) return;
            hideError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Mohon masukkan email dan password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');

            try {
                // 1. Sign in with Supabase Auth
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) {
                    recordFailedLogin('Email atau password salah.');
                    return;
                }

                if (!authData || !authData.user) {
                    recordFailedLogin('Email atau password salah.');
                    return;
                }

                // 2. Check admin_profiles table
                const { data: profile, error: profileError } = await supabaseClient
                    .from('admin_profiles')
                    .select('id, full_name, role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError || !profile) {
                    // Authenticated user is not registered in admin_profiles
                    await supabaseClient.auth.signOut();
                    recordFailedLogin('Akun ini tidak terdaftar sebagai admin.');
                    return;
                }

                // 3. Success: redirect to dashboard
                failedLoginAttempts = 0;
                window.location.replace('/admin/dashboard.html');
            } catch (err) {
                console.error('Login error:', err);
                showError('Terjadi kesalahan koneksi. Silakan coba lagi.');
            } finally {
                submitBtn.classList.remove('loading');
                if (!loginLockoutTimer) {
                    submitBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
